[project]
name = "docuvoice-agent"
version = "0.1.0"
description = "DocuVoice LiveKit Voice Agent — Insurance Claims MVP"
requires-python = ">=3.13"
dependencies = [
    "livekit-agents>=1.4.5,<1.5",
    "livekit-plugins-aws[realtime]>=1.2",
    "livekit-plugins-silero>=1.4",
    "boto3>=1.36,<2",
    "aioboto3>=14.1",
    "pydantic~=2.10",
    "pydantic-settings~=2.7",
    "structlog>=24,<26",
    "tiktoken~=0.8",
    "python-dotenv~=1.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "moto[dynamodb,s3]>=5",
    "ruff>=0.8",
]

[project.scripts]
docuvoice-agent = "agent.entrypoint:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["agent"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
