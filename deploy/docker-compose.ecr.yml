# Docker Compose for EC2 — pulls pre-built images from ECR
# Usage: docker compose -f deploy/docker-compose.ecr.yml up -d
services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    networks:
      - docuvoice

  backend:
    image: 136673894316.dkr.ecr.us-east-1.amazonaws.com/docuvoice-backend:latest
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      - APP_ENV=production
      - STORAGE_BACKEND=dynamodb
      - CORS_ORIGINS=["https://novasonic-hackathon.sumanpaudel.me"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks:
      - docuvoice
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/docuvoice-backend
        awslogs-region: us-east-1
        awslogs-stream-prefix: backend
    deploy:
      resources:
        limits:
          memory: 1G

  frontend:
    image: 136673894316.dkr.ecr.us-east-1.amazonaws.com/docuvoice-frontend:latest
    restart: unless-stopped
    environment:
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docuvoice
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/docuvoice-frontend
        awslogs-region: us-east-1
        awslogs-stream-prefix: frontend
    deploy:
      resources:
        limits:
          memory: 512M

  agent:
    image: 136673894316.dkr.ecr.us-east-1.amazonaws.com/docuvoice-agent:latest
    restart: unless-stopped
    env_file:
      - ./agents/.env
    environment:
      - APP_ENV=production
      - BACKEND_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - docuvoice
    logging:
      driver: awslogs
      options:
        awslogs-group: /ecs/docuvoice-agent
        awslogs-region: us-east-1
        awslogs-stream-prefix: agent
    deploy:
      resources:
        limits:
          memory: 4G
        reservations:
          memory: 2G

volumes:
  caddy_data:
  caddy_config:

networks:
  docuvoice:
    driver: bridge
